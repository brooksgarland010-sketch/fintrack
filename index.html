<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>fintrack</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="fintrack">
<meta name="theme-color" content="#050a07">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#050a07;height:100%;overflow-x:hidden;}
#root{height:100%;}
input,select,button,textarea{font-family:'Outfit',sans-serif;}
::-webkit-scrollbar{display:none;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(0,232,122,0.15)}50%{box-shadow:0 0 35px rgba(0,232,122,0.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;

if(localStorage.getItem("ft_version")!=="3"){
  localStorage.removeItem("ft_txns");
  localStorage.removeItem("ft_balance");
  localStorage.removeItem("ft_connected");
  localStorage.setItem("ft_version","3");
}

const C={
  bg:"#050a07",card:"#0a1210",cardHover:"#0f1a16",surface:"#060d09",
  accent:"#00e87a",accentBg:"rgba(0,232,122,0.09)",accentBorder:"rgba(0,232,122,0.25)",accentGlow:"rgba(0,232,122,0.15)",
  red:"#ff3d5a",redBg:"rgba(255,61,90,0.09)",redBorder:"rgba(255,61,90,0.25)",
  amber:"#ffb830",amberBg:"rgba(255,184,48,0.09)",amberBorder:"rgba(255,184,48,0.25)",
  text:"#eaf5ef",textSub:"#7a9e89",muted:"#3a5445",border:"#162a1e",borderLight:"#1f3829",
};

const CAT_COLORS={
  "Food & Dining":{bg:"rgba(255,120,50,0.15)",color:"#ff7832",dark:"rgba(255,120,50,0.08)"},
  "Shopping":{bg:"rgba(168,85,247,0.15)",color:"#a855f7",dark:"rgba(168,85,247,0.08)"},
  "Entertainment":{bg:"rgba(59,130,246,0.15)",color:"#60a5fa",dark:"rgba(59,130,246,0.08)"},
  "Transportation":{bg:"rgba(234,179,8,0.15)",color:"#fbbf24",dark:"rgba(234,179,8,0.08)"},
  "Health":{bg:"rgba(52,211,153,0.15)",color:"#34d399",dark:"rgba(52,211,153,0.08)"},
  "Utilities":{bg:"rgba(6,182,212,0.15)",color:"#22d3ee",dark:"rgba(6,182,212,0.08)"},
  "Income":{bg:"rgba(0,232,122,0.15)",color:"#00e87a",dark:"rgba(0,232,122,0.08)"},
  "Other":{bg:"rgba(148,163,184,0.15)",color:"#94a3b8",dark:"rgba(148,163,184,0.08)"},
};

const CATS=["Food & Dining","Shopping","Entertainment","Transportation","Health","Utilities","Income","Other"];
const EMOJI={"Food & Dining":"🥡","Shopping":"🛍","Entertainment":"🎮","Transportation":"⛽","Health":"💊","Utilities":"💡","Income":"💵","Other":"📦"};
const TODAY=new Date().toISOString().slice(0,10);

function fmt(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}

function getWeekRange(){
  const now=new Date();const day=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-day+(day===0?-6:1));mon.setHours(0,0,0,0);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  return{start:mon,end:sun};
}

async function compressImage(dataUrl){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const max=700;const ratio=Math.min(max/img.width,max/img.height,1);
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL("image/jpeg",0.6));
    };
    img.src=dataUrl;
  });
}

function CatIcon({category,size=44,photo=null}){
  const cc=CAT_COLORS[category]||CAT_COLORS["Other"];
  return(
    <div style={{width:size,height:size,borderRadius:size*0.28,overflow:"hidden",flexShrink:0,
      background:photo?"#000":cc.bg,border:`1px solid ${photo?"transparent":cc.color+"30"}`,
      display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.45}}>
      {photo?<img src={photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:EMOJI[category]||"📦"}
    </div>
  );
}

function ScanField({label,value,onChange}){
  const[editing,setEditing]=useState(false);
  const[val,setVal]=useState(String(value));
  return(
    <div style={{marginBottom:14}}>
      <p style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.textSub,letterSpacing:2,marginBottom:6,textTransform:"uppercase"}}>{label}</p>
      {editing
        ?<input autoFocus value={val} onChange={e=>setVal(e.target.value)} onBlur={()=>{onChange(val);setEditing(false);}}
          style={{width:"100%",background:C.surface,border:`1.5px solid ${C.accent}`,color:C.text,borderRadius:10,padding:"10px 14px",fontSize:15,outline:"none",boxShadow:`0 0 0 3px ${C.accentGlow}`}}/>
        :<div onClick={()=>setEditing(true)}
          style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:C.surface,borderRadius:10,border:`1px solid ${C.border}`,cursor:"pointer"}}>
          <span style={{fontSize:16,color:C.text,fontWeight:500}}>{label==="Amount"?`$${parseFloat(value).toFixed(2)}`:value}</span>
          <span style={{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>edit</span>
        </div>
      }
    </div>
  );
}

function App(){
  const mono={fontFamily:"'JetBrains Mono',monospace"};
  const[tab,setTab]=useState("home");
  const[balance,setBalance]=useState(()=>parseFloat(localStorage.getItem("ft_balance")||"0"));
  const[bankConnected,setBankConnected]=useState(()=>localStorage.getItem("ft_connected")==="1");
  const[txns,setTxns]=useState(()=>{try{const s=localStorage.getItem("ft_txns");return s?JSON.parse(s):[];}catch{return[];}});
  const[nextId,setNextId]=useState(()=>{try{const p=JSON.parse(localStorage.getItem("ft_txns")||"[]");return p.length?Math.max(...p.map(t=>t.id))+1:1;}catch{return 1;}});
  const[apiKey,setApiKey]=useState(()=>localStorage.getItem("ft_apikey")||"");
  const[showSettings,setShowSettings]=useState(false);
  const[showBankModal,setShowBankModal]=useState(false);
  const[scanning,setScanning]=useState(false);
  const[scanResult,setScanResult]=useState(null);
  const[scanPhoto,setScanPhoto]=useState(null);
  const[scanMode,setScanMode]=useState("receipt");
  const[preview,setPreview]=useState(null);
  const[manualForm,setManualForm]=useState({amount:"",store:"",category:"Other",date:TODAY});
  const[habits,setHabits]=useState("");
  const[loadingHabits,setLoadingHabits]=useState(false);
  const[emailTxt,setEmailTxt]=useState("");
  const[copied,setCopied]=useState(false);
  const[toast,setToast]=useState("");
  const[toastType,setToastType]=useState("success");
  const[manualBal,setManualBal]=useState("");
  const[keyInput,setKeyInput]=useState(apiKey);
  const[selectedTxn,setSelectedTxn]=useState(null);
  const[plaidLoading,setPlaidLoading]=useState(false);
  const fileRef=useRef();

  useEffect(()=>{try{localStorage.setItem("ft_txns",JSON.stringify(txns));}catch{}},[txns]);
  useEffect(()=>{try{localStorage.setItem("ft_balance",String(balance));}catch{}},[balance]);

  const{start:wStart,end:wEnd}=getWeekRange();
  const thisWeek=txns.filter(t=>{const d=new Date(t.date);return d>=wStart&&d<=wEnd;});
  const weekIncome=thisWeek.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const weekExpense=thisWeek.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const weekNet=weekIncome-weekExpense;
  const byCat=thisWeek.filter(t=>t.type==="expense").reduce((acc,t)=>{acc[t.category]=(acc[t.category]||0)+t.amount;return acc;},{});
  const wLabel=`${wStart.toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${wEnd.toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;

  function showToast(msg,type="success"){setToast(msg);setToastType(type);setTimeout(()=>setToast(""),2800);}

  async function doScan(file){
    if(!apiKey){showToast("Add API key in Settings","warning");setShowSettings(true);return;}
    const reader=new FileReader();
    reader.onload=async e=>{
      const compressed=await compressImage(e.target.result);
      setPreview(compressed);setScanning(true);
      try{
        const res=await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
          body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:400,messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:"image/jpeg",data:compressed.split(",")[1]}},
            {type:"text",text:'Analyze this receipt. Return ONLY a valid JSON object with: "amount" (number), "store" (string), "category" (one of: Food & Dining,Shopping,Entertainment,Transportation,Health,Utilities,Other), "date" (YYYY-MM-DD or today if not visible), "items" (string, top 2-3 items or "N/A"). JSON only, no markdown.'}
          ]}]})
        });
        const data=await res.json();
        if(data.error)throw new Error(data.error.message);
        const txt=data.content?.map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
        setScanResult(JSON.parse(txt));setScanPhoto(compressed);
      }catch(err){setScanResult({error:true,msg:err.message||""});}
      setScanning(false);
    };
    reader.readAsDataURL(file);
  }

  async function doScanPaystub(file){
    if(!apiKey){showToast("Add API key in Settings","warning");setShowSettings(true);return;}
    const reader=new FileReader();
    reader.onload=async e=>{
      const compressed=await compressImage(e.target.result);
      setPreview(compressed);setScanning(true);
      try{
        const res=await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
          body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:400,messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:"image/jpeg",data:compressed.split(",")[1]}},
            {type:"text",text:'Analyze this pay stub. Return ONLY a valid JSON object with: "amount" (number - the NET PAY or take-home pay after all deductions, NOT gross pay), "store" (string - employer name), "date" (YYYY-MM-DD, use pay period end date or check date), "items" (string - brief description like "Net pay after taxes"). JSON only, no markdown.'}
          ]}]})
        });
        const data=await res.json();
        if(data.error)throw new Error(data.error.message);
        const txt=data.content?.map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
        const parsed=JSON.parse(txt);
        setScanResult({...parsed,category:"Income"});setScanPhoto(compressed);
      }catch(err){setScanResult({error:true,msg:err.message||""});}
      setScanning(false);
    };
    reader.readAsDataURL(file);
  }

  function addTxn(data,photo=null){
    const amount=parseFloat(data.amount);
    const type=data.category==="Income"?"income":"expense";
    const t={id:nextId,amount,store:data.store,category:data.category,date:data.date||TODAY,type,photo:photo||null};
    setTxns(prev=>[t,...prev]);setNextId(n=>n+1);
    setBalance(prev=>{const n=type==="income"?prev+amount:prev-amount;localStorage.setItem("ft_balance",String(n));return n;});
    setScanResult(null);setPreview(null);setScanPhoto(null);
    setManualForm({amount:"",store:"",category:"Other",date:TODAY});
    showToast(type==="income"?"Income added!":"Expense logged!");setTab("home");
  }

  function deleteTxn(id){
    const t=txns.find(t=>t.id===id);
    if(t){setBalance(prev=>{const n=t.type==="income"?prev-t.amount:prev+t.amount;localStorage.setItem("ft_balance",String(n));return n;});}
    setTxns(prev=>prev.filter(t=>t.id!==id));setSelectedTxn(null);showToast("Deleted","error");
  }

  async function getHabits(){
    if(!apiKey){showToast("Add API key in Settings","warning");setShowSettings(true);return;}
    setLoadingHabits(true);setHabits("");
    try{
      const lines=txns.slice(0,20).map(t=>`${t.date}: ${t.type==="income"?"IN":"OUT"} $${t.amount.toFixed(2)} — ${t.store} (${t.category})`).join("\n");
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:700,messages:[{role:"user",content:`You are a friendly personal finance coach. Analyze these transactions and give exactly 4 specific, actionable spending tips numbered 1-4. Each tip 2-3 sentences. Plain text only, no markdown.\n\n${lines}`}]})
      });
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      setHabits(data.content[0]?.text||"Could not analyze.");
    }catch(err){setHabits("Error: "+err.message);}
    setLoadingHabits(false);
  }

  function makeEmail(){
    const catLines=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`  ${EMOJI[k]||"•"} ${k}: $${fmt(v)}`).join("\n");
    setEmailTxt(`WEEKLY FINANCE REPORT\n${wLabel}\n${"─".repeat(36)}\n💵  Income:    $${fmt(weekIncome)}\n💸  Expenses:  $${fmt(weekExpense)}\n            ──────────────\n${weekNet>=0?"✅":"🔴"}  Net:       ${weekNet>=0?"+":"–"}$${fmt(Math.abs(weekNet))}\n\nSPENDING BY CATEGORY:\n${catLines||"  No expenses this week."}\n\n${weekNet>=0?"Great week — you came out ahead!":"Spent more than earned. Check your habit tips."}\n${"─".repeat(36)}\nSent by fintrack`);
  }

  async function connectPlaid(){
    setPlaidLoading(true);
    try{
      const res=await fetch("/api/link-token");
      if(!res.ok)throw new Error("backend not set up");
      const{link_token}=await res.json();
      const handler=window.Plaid.create({
        token:link_token,
        onSuccess:async(public_token)=>{
          const r=await fetch("/api/balance",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({public_token})});
          const{balance:bal}=await r.json();
          setBalance(bal);setBankConnected(true);
          localStorage.setItem("ft_balance",String(bal));localStorage.setItem("ft_connected","1");
          showToast("Bank connected!");setShowBankModal(false);
        },
        onExit:()=>{}
      });
      handler.open();
    }catch{showToast("Use manual balance for now","warning");}
    setPlaidLoading(false);
  }

  const card=(extra={})=>({background:C.card,borderRadius:18,border:`1px solid ${C.border}`,padding:"18px 20px",marginBottom:12,...extra});
  const pill=(bg,color)=>({display:"inline-flex",alignItems:"center",gap:4,background:bg,color,borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:600,fontFamily:"'JetBrains Mono',monospace",letterSpacing:0.5});

  const renderHome=()=>(
    <div style={{padding:"0 16px"}} className="fade-up">
      <div style={{...card(),padding:"32px 24px",marginBottom:14,position:"relative",overflow:"hidden",background:"linear-gradient(145deg,#0c1a12,#091410)",boxShadow:"0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.04)",border:`1px solid ${C.borderLight}`}}>
        <div style={{position:"absolute",top:-60,right:-60,width:200,height:200,borderRadius:"50%",background:`radial-gradient(circle,${C.accentGlow} 0%,transparent 70%)`}}/>
        <div style={{position:"relative"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
            <div>
              <p style={{...mono,fontSize:10,color:C.muted,letterSpacing:3,marginBottom:4}}>{bankConnected?"LIVE BALANCE":"BALANCE"}</p>
              <div style={{display:"flex",alignItems:"baseline",gap:2}}>
                <span style={{...mono,fontSize:13,color:C.textSub}}>$</span>
                <span style={{...mono,fontSize:48,fontWeight:600,color:C.text,lineHeight:1,letterSpacing:-2,textShadow:`0 0 40px ${C.accentGlow}`}}>{fmt(balance).split(".")[0]}</span>
                <span style={{...mono,fontSize:24,color:C.textSub,alignSelf:"flex-end",marginBottom:4}}>.{fmt(balance).split(".")[1]}</span>
              </div>
            </div>
            <button onClick={()=>setShowBankModal(true)} style={{padding:"8px 16px",background:bankConnected?C.accentBg:"rgba(255,255,255,0.04)",border:`1px solid ${bankConnected?C.accentBorder:C.border}`,color:bankConnected?C.accent:C.textSub,borderRadius:24,fontSize:12,cursor:"pointer",...mono,letterSpacing:1}}>
              {bankConnected?"✓ LIVE":"+ BANK"}
            </button>
          </div>
          <div style={{display:"flex",gap:6}}>
            <span style={pill(C.accentBg,C.accent)}>↑ ${fmt(weekIncome)} in</span>
            <span style={pill(C.redBg,C.red)}>↓ ${fmt(weekExpense)} out</span>
          </div>
        </div>
      </div>
      <div style={{...card(),marginBottom:14,background:weekNet>=0?"linear-gradient(135deg,#0a1a0f,#0f2418)":"linear-gradient(135deg,#140a0e,#1a0f14)",border:`1px solid ${weekNet>=0?C.accentBorder:C.redBorder}`,boxShadow:`0 4px 20px ${weekNet>=0?"rgba(0,232,122,0.08)":"rgba(255,61,90,0.08)"}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <p style={{fontSize:12,color:C.textSub,marginBottom:6,fontWeight:500}}>This week you {weekNet>=0?"made":"lost"}</p>
            <p style={{...mono,fontSize:34,color:weekNet>=0?C.accent:C.red,fontWeight:600,letterSpacing:-1}}>{weekNet>=0?"+":"–"}${fmt(Math.abs(weekNet))}</p>
          </div>
          <div style={{width:52,height:52,borderRadius:16,background:weekNet>=0?C.accentBg:C.redBg,border:`1px solid ${weekNet>=0?C.accentBorder:C.redBorder}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>{weekNet>=0?"📈":"📉"}</div>
        </div>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,marginTop:4}}>
        <p style={{...mono,fontSize:10,color:C.muted,letterSpacing:3}}>RECENT</p>
        <p style={{fontSize:12,color:C.muted}}>{txns.length} total</p>
      </div>
      {txns.length===0&&(
        <div style={{...card(),textAlign:"center",padding:"48px 24px",border:`1px dashed ${C.border}`}}>
          <div style={{fontSize:48,marginBottom:16}}>📋</div>
          <p style={{fontSize:16,color:C.text,fontWeight:600,marginBottom:8}}>No transactions yet</p>
          <p style={{fontSize:13,color:C.muted,lineHeight:1.6}}>Tap the scan tab to add your first receipt or pay stub</p>
        </div>
      )}
      {txns.slice(0,20).map((t,i)=>(
        <div key={t.id} onClick={()=>setSelectedTxn(t)}
          style={{...card(),display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",cursor:"pointer",animationDelay:`${i*0.04}s`}}
          onTouchStart={e=>e.currentTarget.style.background=C.cardHover}
          onTouchEnd={e=>e.currentTarget.style.background=C.card}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <CatIcon category={t.category} photo={t.photo} size={46}/>
            <div>
              <p style={{fontSize:15,fontWeight:600,color:C.text,marginBottom:3}}>{t.store}</p>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{...pill(CAT_COLORS[t.category]?.dark||"rgba(148,163,184,0.08)",CAT_COLORS[t.category]?.color||"#94a3b8"),padding:"2px 8px",fontSize:10}}>{t.category}</span>
                <span style={{fontSize:11,color:C.muted,...mono}}>{t.date}</span>
                {t.photo&&<span style={{fontSize:11}}>📷</span>}
              </div>
            </div>
          </div>
          <p style={{...mono,fontSize:16,color:t.type==="income"?C.accent:C.text,fontWeight:600,whiteSpace:"nowrap"}}>{t.type==="income"?"+":"–"}${fmt(t.amount)}</p>
        </div>
      ))}
      <div style={{height:8}}/>
    </div>
  );

  const renderReceipt=()=>(
    <div style={{padding:"0 16px"}} className="fade-up">
      <p style={{...mono,fontSize:10,color:C.muted,letterSpacing:3,marginBottom:16}}>SCAN DOCUMENT</p>
      <div style={{display:"flex",gap:8,marginBottom:16,background:C.surface,borderRadius:14,padding:4,border:`1px solid ${C.border}`}}>
        {[{id:"receipt",label:"📷 Receipt",sub:"expenses"},{id:"paystub",label:"💵 Pay Stub",sub:"income"}].map(m=>(
          <button key={m.id} onClick={()=>{setScanMode(m.id);setScanResult(null);setPreview(null);setScanPhoto(null);}}
            style={{flex:1,padding:"10px 8px",borderRadius:10,border:"none",cursor:"pointer",background:scanMode===m.id?C.card:"transparent",boxShadow:scanMode===m.id?"0 2px 8px rgba(0,0,0,0.3)":"none",transition:"all 0.2s"}}>
            <p style={{fontSize:13,fontWeight:600,color:scanMode===m.id?C.text:C.muted,marginBottom:2}}>{m.label}</p>
            <p style={{fontSize:10,color:scanMode===m.id?C.textSub:C.muted,...mono}}>{m.sub}</p>
          </button>
        ))}

          <p style={{fontSize:12,color:C.textSub,lineHeight:1.7}}>Apply free at dashboard.plaid.com → Get production access. Takes 1-3 days.</p>
        </div>
        <p style={{fontSize:14,color:C.text,fontWeight:500,marginBottom:10}}>Update balance manually:</p>
        <input type="number" value={manualBal} onChange={e=>setManualBal(e.target.value)} placeholder="e.g. 2500.00" style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,color:C.text,borderRadius:12,padding:"14px 16px",fontSize:16,marginBottom:12,outline:"none"}}/>
        <button onClick={()=>{if(manualBal){setBalance(parseFloat(manualBal));localStorage.setItem("ft_balance",manualBal);showToast("Balance updated!");}setShowBankModal(false);}} style={{width:"100%",padding:"15px",background:C.accent,color:"#000",border:"none",borderRadius:12,fontSize:16,fontWeight:700,cursor:"pointer",boxShadow:`0 4px 16px ${C.accentGlow}`}}>Save Balance</button>
      </div>
    </div>
  );

  const TABS=[
    {id:"home",label:"Home",icon:(a)=><svg width="22" height="22" viewBox="0 0 24 24" fill={a?"#00e87a":"#3a5445"} stroke="none"><path d="M12 2L2 10h3v10h6v-6h2v6h6V10h3L12 2z"/></svg>},
    {id:"receipt",label:"Scan",icon:(a)=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?"#00e87a":"#3a5445"} strokeWidth="2" strokeLinecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8h10M7 12h10M7 16h5"/></svg>},
    {id:"summary",label:"Summary",icon:(a)=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?"#00e87a":"#3a5445"} strokeWidth="2" strokeLinecap="round"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-8"/></svg>},
    {id:"habits",label:"Habits",icon:(a)=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?"#00e87a":"#3a5445"} strokeWidth="2" strokeLinecap="round"><path d="M12 2a7 7 0 017 7c0 5-7 13-7 13S5 14 5 9a7 7 0 017-7z"/><circle cx="12" cy="9" r="2.5"/></svg>},
  ];

  const toastColor=toastType==="error"?C.red:toastType==="warning"?C.amber:C.accent;

  return(
    <div style={{fontFamily:"'Outfit',sans-serif",background:C.bg,color:C.text,minHeight:"100vh",maxWidth:480,margin:"0 auto",position:"relative",paddingBottom:90}}>
      {toast&&<div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",background:C.card,color:toastColor,padding:"11px 24px",borderRadius:24,fontWeight:600,fontSize:13,zIndex:500,whiteSpace:"nowrap",border:`1px solid ${toastColor}40`,boxShadow:`0 4px 24px rgba(0,0,0,0.5),0 0 20px ${toastColor}20`,animation:"fadeUp 0.3s ease"}}>{toast}</div>}
      <div style={{padding:"52px 20px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px solid ${C.border}`}}>
        <div>
          <h1 style={{...mono,fontSize:22,fontWeight:600,margin:0,letterSpacing:-0.5}}><span style={{color:C.accent}}>fin</span><span style={{color:C.text}}>track</span></h1>
          <p style={{fontSize:11,color:C.muted,marginTop:2,...mono,letterSpacing:1}}>{new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</p>
        </div>
        <button onClick={()=>setShowSettings(true)} style={{background:C.card,border:`1px solid ${C.border}`,color:C.textSub,width:40,height:40,borderRadius:12,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 8px rgba(0,0,0,0.3)"}}>⚙</button>
      </div>
      <div style={{padding:"20px 0"}}>
        {tab==="home"&&renderHome()}
        {tab==="receipt"&&renderReceipt()}
        {tab==="summary"&&renderSummary()}
        {tab==="habits"&&renderHabits()}
      </div>
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.card,borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"space-around",padding:"10px 0 26px",zIndex:100,boxShadow:"0 -4px 24px rgba(0,0,0,0.4)"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,background:"none",border:"none",cursor:"pointer",padding:"6px 16px",position:"relative"}}>
            {tab===t.id&&<div style={{position:"absolute",top:-10,left:"50%",transform:"translateX(-50%)",width:32,height:3,borderRadius:3,background:C.accent,boxShadow:`0 0 8px ${C.accent}`}}/>}
            {t.icon(tab===t.id)}
            <span style={{fontSize:10,...mono,letterSpacing:1,color:tab===t.id?C.accent:C.muted,fontWeight:tab===t.id?"600":"400"}}>{t.label.toUpperCase()}</span>
          </button>
        ))}
      </div>
      <TxnModal/>
      {showSettings&&<SettingsModal/>}
      {showBankModal&&<BankModal/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
